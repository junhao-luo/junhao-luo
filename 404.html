<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Node Not Found | Eljhon Steve (羅俊豪)</title>
  <meta name="description" content="The requested workflow endpoint or page could not be located. Return to the main AI architecture hub.">
  <meta name="theme-color" content="#030712">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    .error-card {
      max-width: 600px;
      width: 100%;
      padding: 48px 36px;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 12vw, 8rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 30%, #00e5ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 32px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #00e5ff, #0066ff);
      color: #000;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
      transform: translateY(-2px);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: #00e5ff;
    }
  </style>
</head>
<body class="cre8tera-theme">
  <div class="technical-grid-overlay" aria-hidden="true"></div>
  
  <main class="error-page-wrapper">
    <div class="glass-text-card error-card">
      <span class="crop-corner c-tl" aria-hidden="true"></span>
      <span class="crop-corner c-tr" aria-hidden="true"></span>
      <span class="crop-corner c-bl" aria-hidden="true"></span>
      <span class="crop-corner c-br" aria-hidden="true"></span>
      
      <div class="section-badge-row">
        <span class="tech-badge">[ ERROR_SIGNAL : 404_ROUTE_UNDEFINED ]</span>
      </div>

      <div class="error-code">404</div>
      <h1 style="font-size: 1.5rem; margin-bottom: 12px; color: #fff;">Pipeline Disconnected</h1>
      <p style="color: #94a3b8; font-size: 0.98rem; line-height: 1.6;">
        The automation endpoint or page you're searching for doesn't exist or has migrated to a new runtime environment. Let's redirect you back into the core system.
      </p>

      <div class="error-actions">
        <a href="/" class="btn-primary">
          <span>← Return to Headquarters</span>
        </a>
        <a href="/#modules" class="btn-secondary">Explore AI Modules</a>
        <a href="/#contact" class="btn-secondary">Ping Eljhon</a>
      </div>
    </div>
  </main>
</body>
</html>
